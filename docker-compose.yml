version: "2.2"

services:
  tetris-casino:
    build: .
    container_name: tetris-gambling-casino
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "18052:18052"
    environment:
      PLAYER_PORT: 8080
      ADMIN_PORT: 18052
      ADMIN_USER: root
      ADMIN_PASSWORD: gambleMaster666
    volumes:
      - ./data:/app/data
