<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>方块战场 · 极乐赌场</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="game-header">
      <a class="brand" href="/index.html">极乐交易城</a>
      <nav class="main-nav">
        <a data-nav href="/index.html">大厅</a><a data-nav href="/game.html">方块战场</a><a data-nav href="/market.html">交易市场</a><a data-nav href="/guilds.html">公会</a><a data-nav href="/activities.html">活动</a><a data-nav href="/rankings.html">排行</a><a data-nav href="/chat.html">聊天</a><a data-nav href="/profile.html">资产</a>
      </nav>
      <div class="header-stats"><span data-player-name>玩家</span><b data-player-coins>1000</b><small>在线 <i data-online>0</i></small></div>
    </header>
    <main class="page-shell game-page">
      <section class="game-zone">
        <div class="topbar">
          <div><h1>方块战场</h1><p id="eventTicker">赌场正在开盘...</p></div>
          <div class="player-card"><input id="playerName" maxlength="16" aria-label="玩家昵称"><button id="saveName">保存</button><a class="ghost-link" href="/market.html">去交易市场</a></div>
        </div>
        <div class="play-layout">
          <div class="board-wrap">
            <canvas id="board" width="300" height="600"></canvas>
            <div class="touch-controls"><button data-action="left">←</button><button data-action="rotate">↻</button><button data-action="right">→</button><button data-action="drop">⤓</button></div>
          </div>
          <aside class="side-panel">
            <div class="stat-grid">
              <div><span>金币</span><strong id="coins">1000</strong></div><div><span>分数</span><strong id="score">0</strong></div><div><span>消除</span><strong id="lines">0</strong></div><div><span>护盾</span><strong id="shields">0</strong></div>
            </div>
            <div class="time-grid">
              <div><span>钟渊能量</span><strong id="zhongyuanValue">0/10</strong><div class="bar"><i id="zhongyuanBar"></i></div></div>
              <div><span>时相</span><strong id="clockState">白昼慢落</strong></div>
              <div><span>模式</span><strong id="modeText">昼夜标准</strong></div>
              <div><span>状态</span><strong id="dangerState">稳定</strong></div>
              <div><span>速度</span><strong id="speedText">820ms</strong></div>
              <div><span>倒计时</span><strong id="modeTimer">阶梯 0</strong></div>
            </div>
            <div class="mode-panel">
              <select id="modeSelect" aria-label="战场模式">
                <option value="standard">昼夜标准</option>
                <option value="timed">60秒限时</option>
                <option value="precision">精准刻度</option>
                <option value="survival">倒计时生存</option>
                <option value="rhythm">节拍坠落</option>
              </select>
              <span id="rhythmLight" class="rhythm-light">节拍</span>
              <span id="specialText">普通方块</span>
            </div>
            <div class="rewind-panel">
              <select id="rewindSelect" aria-label="回溯状态"><option>暂无可回溯状态</option></select>
              <button id="rewindBtn" disabled>回溯</button>
            </div>
            <div class="next-box"><span>下一块</span><canvas id="next" width="120" height="120"></canvas></div>
            <div class="actions"><button id="startBtn">开始</button><button id="pauseBtn">暂停</button><button id="restartBtn">重开</button></div>
            <div class="legend"><b>I 暴击</b><b>O 铁壁</b><b>T 混乱</b><b>L 贪财</b><b>J 冻结</b><b>S 毒雾</b><b>Z 自爆</b><b>时 倒流</b><b>摆 钟摆</b><b>咒 诅咒</b></div>
          </aside>
        </div>
      </section>
      <aside class="panel">
        <h2>战场事件</h2>
        <div id="battleFeed" class="event-list"></div>
      </aside>
    </main>
    <script type="module" src="/js/auth.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
