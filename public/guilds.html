  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>公会系统</title><link rel="stylesheet" href="/styles.css"></head>
  <body>
    <header class="game-header"><a class="brand" href="/index.html">终焉钟城</a><nav class="main-nav"><a data-nav href="/index.html">大厅</a><a data-nav href="/game.html">方块战场</a><a data-nav href="/market.html">交易市场</a><a data-nav href="/guilds.html">公会</a><a data-nav href="/activities.html">活动</a><a data-nav href="/rankings.html">排行</a><a data-nav href="/chat.html">聊天</a><a data-nav href="/profile.html">资产</a></nav><div class="header-stats"><span data-player-name>玩家</span><b data-player-coins>1000</b><small>在线 <i data-online>0</i></small></div></header>
