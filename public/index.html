<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>极乐赌场大厅</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="game-header">
      <a class="brand" href="/index.html">俄罗斯方块 · 极乐赌场</a>
      <nav class="main-nav">
        <a data-nav href="/index.html">大厅</a>
        <a data-nav href="/game.html">方块战场</a>
        <a data-nav href="/market.html">交易市场</a>
        <a data-nav href="/guilds.html">公会</a>
        <a data-nav href="/rankings.html">排行</a>
        <a data-nav href="/chat.html">聊天</a>
        <a data-nav href="/profile.html">资产</a>
      </nav>
      <div class="header-stats"><span data-player-name>玩家</span><b data-player-coins>1000</b><small>在线 <i data-online>0</i></small></div>
    </header>

    <main class="page-shell lobby-grid">
      <section class="hero-band">
        <div>
          <h1>极乐赌场开盘</h1>
          <p id="nextEvent">系统事件加载中...</p>
        </div>
        <a class="primary-link" href="/game.html">进入方块战场</a>
      </section>

      <section class="panel kpi-row">
        <div><span>庄家池</span><strong id="bankerPool">0</strong></div>
        <div><span>公会战</span><strong id="guildWar">等待开赛</strong></div>
        <div><span>公会 BOSS</span><strong id="bossHpText">加载中</strong><div class="bar"><i id="bossHp"></i></div></div>
      </section>

      <section class="panel">
        <h2>股票热榜</h2>
        <div id="stocks" class="market-list"></div>
      </section>

      <section class="panel">
        <h2>期货赌场</h2>
        <div id="futures" class="market-list"></div>
      </section>

      <section class="panel">
        <h2>今日排行榜</h2>
        <ol id="dailyRanks" class="rank-list"></ol>
      </section>

      <section class="panel">
        <h2>全服情绪</h2>
        <div id="chat" class="chat-log short"></div>
      </section>
    </main>
    <script type="module" src="/js/lobby.js"></script>
  </body>
</html>
