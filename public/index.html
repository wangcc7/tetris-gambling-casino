<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>终焉钟城 V2</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="v2-body">
    <div id="trainOverlay" class="train-arrival-overlay"></div>
    <div id="stationHaze" class="station-haze"></div>
    <div id="app" class="v2-app">
      <header class="v2-header">
        <button id="centerToggle" class="icon-btn" type="button">≡</button>
        <div class="v2-brand">
          <b>终焉钟城</b>
          <span id="cycleTitle">第--天 · 钟声校准中</span>
        </div>
        <div class="v2-clock">
          <span id="serverClock">同步时间中...</span>
          <small id="dayRemain">剩余 --:--:--</small>
          <small id="systemMeta">版本 -- · 济南天气 --</small>
        </div>
        <button id="audioToggle" class="icon-btn audio-toggle" type="button">声场</button>
        <div class="v2-player">
          <span id="playerName">未登录</span>
          <b><i id="playerMarks">0</i> 刻痕</b>
          <button id="authBtn" type="button">登录 / 注册</button>
        </div>
      </header>

      <aside class="v2-left">
        <section class="trial-panel">
          <div class="panel-head">
            <div>
              <h1>方块试炼</h1>
              <p id="zodiacEffect">等待晨钟列车宣告规则</p>
              <div class="trial-mode-row">
                <select id="trialMode" aria-label="试炼模式">
                  <option value="standard">昼夜标准</option>
                  <option value="timed">60秒限时</option>
                  <option value="precision">精准刻度</option>
                  <option value="survival">倒计时生存</option>
                  <option value="rhythm">节拍坠落</option>
                </select>
                <span id="rhythmLight" class="rhythm-light">节拍</span>
              </div>
            </div>
            <button id="startTrial" type="button">开始试炼</button>
          </div>
          <div class="trial-board-shell">
            <canvas id="trialBoard" width="300" height="600"></canvas>
            <div id="trialOverlay" class="trial-overlay"></div>
          </div>
          <div class="trial-stats">
            <span>分数 <b id="trialScore">0</b></span>
            <span>消行 <b id="trialLines">0</b></span>
            <span>连击 <b id="trialCombo">0</b></span>
            <span>暂存 <b id="holdPiece">--</b></span>
            <span>模式 <b id="trialModeText">昼夜标准</b></span>
            <span>计时 <b id="trialTimer">0s</b></span>
          </div>
          <div class="trial-subgrid">
            <div class="next-preview"><span>NEXT</span><canvas id="nextPiece" width="110" height="110"></canvas></div>
            <div class="rewind-panel-v2">
              <div><span>钟渊</span><b id="zhongyuanValue">0/10</b></div>
              <div class="path-bar"><i id="zhongyuanBar" style="width:0%"></i></div>
              <select id="rewindSelect" aria-label="回溯点"><option>暂无回溯点</option></select>
              <button id="rewindBtn" type="button" disabled>回溯</button>
            </div>
          </div>
          <div class="touch-pad" aria-label="移动端触摸控制">
            <button data-touch="left" type="button">←</button>
            <button data-touch="rotate" type="button">↻</button>
            <button data-touch="right" type="button">→</button>
            <button data-touch="drop" type="button">↓</button>
          </div>
          <div class="trial-help">←/→ 移动，↓ 软降，↑/Z 旋转，空格硬降，C 暂存</div>
        </section>
      </aside>

      <main class="v2-center">
        <nav class="plaza-tabs">
          <button data-tab="broadcast" class="active">广播</button>
          <button data-tab="rankings">名录</button>
          <button data-tab="fog">雾区</button>
          <button data-tab="pact">契约</button>
          <button data-tab="oracle">情报</button>
        </nav>
        <section id="tabContent" class="plaza-content"></section>
      </main>

      <aside class="v2-right">
        <section class="chronicle">
          <div class="panel-head">
            <div>
              <h2>铭刻之书</h2>
              <p id="identityNo">试炼者编号：--</p>
            </div>
            <button id="rightToggle" class="icon-btn" type="button">收</button>
          </div>
          <div id="chronicleContent"></div>
        </section>
      </aside>

      <footer class="v2-footer">
        <div id="trainRail" class="train-rail">
          <span>下一班列车：同步中...</span>
          <span id="trainCountdown" class="train-countdown" style="display:none"></span>
        </div>
        <div class="train-indicators" id="trainIndicators">
          <span class="train-dot pending" data-train="0" title="晨钟列车"></span>
          <span class="train-dot pending" data-train="1" title="正午列车"></span>
          <span class="train-dot pending" data-train="2" title="黄昏列车"></span>
          <span class="train-dot pending" data-train="3" title="午夜列车"></span>
          <span class="train-dot pending" data-train="4" title="终焉列车"></span>
        </div>
        <div id="railBroadcast">钟楼仍在校准。</div>
        <div id="trainLog" class="train-log" style="display:none"></div>
        <div id="rulePanel" class="rule-panel">
          <div class="rule-row"><span class="rule-label">今日生肖</span><span id="ruleZodiac">--</span></div>
          <div class="rule-row"><span class="rule-label">神兽降临</span><span id="ruleBeast">--</span></div>
          <div class="rule-row"><span class="rule-label">雾区动向</span><span id="ruleFog">--</span></div>
          <div class="rule-row"><span class="rule-label">试炼加成</span><span id="ruleBoost">--</span></div>
        </div>
      </footer>
    </div>

    <dialog id="authDialog" class="auth-dialog">
      <form method="dialog" id="authForm">
        <h2>入城登记</h2>
        <input id="authUsername" autocomplete="username" placeholder="账号">
        <input id="authPassword" type="password" autocomplete="current-password" placeholder="密码">
        <input id="authNickname" placeholder="昵称（注册时使用）">
        <div class="auth-actions">
          <button id="loginBtn" value="login" type="submit">登录</button>
          <button id="registerBtn" value="register" type="submit">注册</button>
          <button value="cancel" type="submit">取消</button>
        </div>
        <p id="authError"></p>
      </form>
    </dialog>

    <div id="toast" class="v2-toast"></div>
    <button id="pathToggle" class="path-toggle-v2" type="button" title="极道·钟渊之路">道</button>
    <aside id="pathPanel" class="path-panel-v2" aria-label="极道钟渊之路">
      <header><b>极道·钟渊之路</b><button id="pathClose" type="button">×</button></header>
      <div id="pathList"></div>
    </aside>
    <script type="module" src="/js/v2-main.js"></script>
  </body>
</html>
