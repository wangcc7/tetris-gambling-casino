<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>终焉钟城 V2</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="v2-body">
    <div id="app" class="v2-app">
      <header class="v2-header">
        <button id="centerToggle" class="icon-btn" type="button">≡</button>
        <div class="v2-brand">
          <b>终焉钟城</b>
          <span id="cycleTitle">第--天 · 钟声校准中</span>
        </div>
        <div class="v2-clock">
          <span id="serverClock">同步时间中...</span>
          <small id="dayRemain">剩余 --:--:--</small>
        </div>
        <div class="v2-player">
          <span id="playerName">未登录</span>
          <b><i id="playerMarks">0</i> 刻痕</b>
          <button id="authBtn" type="button">登录 / 注册</button>
        </div>
      </header>

      <aside class="v2-left">
        <section class="trial-panel">
          <div class="panel-head">
            <div>
              <h1>方块试炼</h1>
              <p id="zodiacEffect">等待晨钟列车宣告规则</p>
            </div>
            <button id="startTrial" type="button">开始试炼</button>
          </div>
          <canvas id="trialBoard" width="300" height="600"></canvas>
          <div class="trial-stats">
            <span>分数 <b id="trialScore">0</b></span>
            <span>消行 <b id="trialLines">0</b></span>
            <span>连击 <b id="trialCombo">0</b></span>
            <span>暂存 <b id="holdPiece">--</b></span>
          </div>
          <div class="trial-help">←/→ 移动，↓ 软降，↑/Z 旋转，空格硬降，C 暂存</div>
        </section>
      </aside>

      <main class="v2-center">
        <nav class="plaza-tabs">
          <button data-tab="broadcast" class="active">广播</button>
          <button data-tab="rankings">名录</button>
          <button data-tab="fog">雾区</button>
          <button data-tab="pact">契约</button>
          <button data-tab="oracle">情报</button>
        </nav>
        <section id="tabContent" class="plaza-content"></section>
      </main>

      <aside class="v2-right">
        <section class="chronicle">
          <div class="panel-head">
            <div>
              <h2>铭刻之书</h2>
              <p id="identityNo">试炼者编号：--</p>
            </div>
            <button id="rightToggle" class="icon-btn" type="button">收</button>
          </div>
          <div id="chronicleContent"></div>
        </section>
      </aside>

      <footer class="v2-footer">
        <div id="trainRail" class="train-rail">下一班列车：同步中...</div>
        <div id="railBroadcast">钟楼仍在校准。</div>
      </footer>
    </div>

    <dialog id="authDialog" class="auth-dialog">
      <form method="dialog" id="authForm">
        <h2>入城登记</h2>
        <input id="authUsername" autocomplete="username" placeholder="账号">
        <input id="authPassword" type="password" autocomplete="current-password" placeholder="密码">
        <input id="authNickname" placeholder="昵称（注册时使用）">
        <div class="auth-actions">
          <button id="loginBtn" value="login" type="submit">登录</button>
          <button id="registerBtn" value="register" type="submit">注册</button>
          <button value="cancel" type="submit">取消</button>
        </div>
        <p id="authError"></p>
      </form>
    </dialog>

    <div id="toast" class="v2-toast"></div>
    <script type="module" src="/js/v2-main.js"></script>
  </body>
</html>
